apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app.kubernetes.io/name: aceest
    app.kubernetes.io/track: green
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aceest
      app.kubernetes.io/track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest
        app.kubernetes.io/track: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: aceest
          image: aceest-fitness:sha-0000000000000000000000000000000000000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_VERSION
              value: "sha-0000000000000000000000000000000000000000"
            - name: ACEEST_DB_PATH
              value: /data/aceest_fitness.db
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aceest-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aceest-secrets
                  key: admin-password
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aceest-secrets
                  key: flask-secret-key
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: aceest-config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aceest-data
        - name: tmp
          emptyDir: {}
