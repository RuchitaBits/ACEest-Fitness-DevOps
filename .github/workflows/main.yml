name: ACEest CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Syntax validation
        run: python -m compileall -q .
      - name: Ruff quality check
        run: python -m ruff check app.py tests
      - name: Unit tests
        run: python -m pytest -q

  docker-build:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: aceest-fitness-devops:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}

  container-tests:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: aceest-fitness-devops:test
      - name: Run pytest inside container
        run: docker run --rm aceest-fitness-devops:test python -m pytest -q
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: aceest-fitness-devops:runtime
      - name: Verify health endpoint
        run: |
          docker run --detach --name aceest-app -p 5000:5000 aceest-fitness-devops:runtime
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:5000/health
      - name: Remove health-check container
        if: always()
        run: docker rm --force aceest-app || true